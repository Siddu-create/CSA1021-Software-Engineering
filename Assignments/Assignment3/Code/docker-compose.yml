services:
  db:
    image: postgres:16-alpine
    container_name: smartcampus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartcampus}
      POSTGRES_USER: ${DB_USER:-campus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_user} -d ${DB_NAME:-smartcampus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smartcampus_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: smartcampus_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: